# Render Blueprint: https://render.com/docs/blueprint-spec
# After first deploy, set PUBLIC_URL in the dashboard to your live URL (e.g. https://vcomingle.onrender.com)

services:
  - type: web
    name: vcomingle
    runtime: node
    # A Free web service spins down after idle time and can be suspended at its
    # monthly limit, making it unsuitable for user-facing pages and crawlers.
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
